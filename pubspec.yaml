name: kise
description: "Kise — personal expense tracker with Ethiopian and Gregorian calendars."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Riverpod because the app's state is a graph of derived values
  # (selected Period -> expenses -> summary) and it recomputes those declaratively.
  flutter_riverpod: ^2.6.1

  # HTTP, with an interceptor for the bearer token.
  dio: ^5.7.0

  # Routing with an auth guard.
  go_router: ^14.6.2

  # Keychain / Keystore. The token never goes in SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # Number and currency formatting.
  intl: ^0.20.3

  # The daily spending chart on the dashboard.
  fl_chart: ^0.69.2

  # The assistant: voice notes (record, into a temp file from path_provider) and receipt photos
  # (image_picker). Pinned exactly: they touch the microphone and camera.
  # Sign in with Google. The OAuth client ids come from env/*.json (GOOGLE_IOS_CLIENT_ID,
  # GOOGLE_SERVER_CLIENT_ID) and the iOS URL scheme from ios/Flutter/Google.xcconfig.
  google_sign_in: 7.2.0

  record: 7.2.0
  image_picker: 1.2.4
  path_provider: 2.1.6

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # The coin mark, rendered from the landing page's CSS by tool/icons/render.sh.
    - assets/brand/coin.png
  # Note: a bundled NotoSansEthiopic is still wanted for Android, where Ethiopic coverage is
  # inconsistent. iOS and macOS render Amharic from system fonts, so it is not blocking yet.
